<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wetter zu Zanderfängen</title>
<style>:root{color-scheme:dark}body{margin:0;background:#070d18;color:#eef3fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
h1{font-size:1.25rem;margin:0 0 6px}p{color:#9fb0c8;font-size:.92rem;margin:6px 0}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:#2f6bff;color:#fff;cursor:pointer;margin:8px 8px 8px 0}
.wrap{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;font-size:.82rem;min-width:900px}th,td{padding:6px 8px;border-bottom:1px solid #22304a;text-align:right;white-space:nowrap}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}th{color:#9fb0c8;font-weight:600}#status{font-weight:700}.sum{background:#121c2e;border:1px solid #22304a;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:.92rem}</style></head>
<body><h1>Wetter zu den Zanderfängen (63)</h1>
<p>Holt für jeden Fang Luftdruck, Drucktendenz (3 Std.), Bewölkung, Wind, Regen und Temperatur von Open-Meteo, jeweils für das richtige Gewässer und den richtigen Tag.</p>
<button id="go">Wetter abrufen</button><button id="csv" hidden>Als CSV speichern</button><div id="status"></div>
<div class="wrap"><table id="t"></table></div><div class="sum" id="sum" hidden></div>
<script>
const F=[["Zander", "2021-06-02T06:15", 75, "Gummifisch", "Tegeler See"], ["Zander", "2021-06-02T21:45", 78, "Streamer", "Tegeler See"], ["Zander", "2021-06-03T12:45", 70, "Gummifisch", "Tegeler See"], ["Zander", "2021-06-07T06:13", 62, "Gummifisch", "Tegeler See"], ["Zander", "2021-08-02T20:30", 87, "Gummifisch", "Tegeler See"], ["Zander", "2021-08-06T19:09", 75, "Wobbler", "Tegeler See"], ["Zander", "2021-12-01T04:23", 96, "Fischfetzen", "Tegeler See"], ["Zander", "2022-06-09T03:36", 69, "Drop-Shot Rig", "Tegeler See"], ["Zander", "2023-05-07T19:31", 65, "Minnow", "Tegeler See"], ["Zander", "2024-05-03T05:58", 84, "Jerkbait", "Tegeler See"], ["Zander", "2024-09-06T20:30", 79, "Gummifisch", "Havel Spandau"], ["Zander", "2024-09-07T21:04", 65, "Gummifisch", "Havel Spandau"], ["Zander", "2024-09-21T00:30", 63, "Gummifisch", "Havel Spandau"], ["Zander", "2024-10-14T21:33", 85, "Köderfisch", "Havel Spandau"], ["Zander", "2024-10-16T13:26", 64, "Köderfisch", "Havel Spandau"], ["Zander", "2024-10-21T01:32", 63, "Gummifisch", "Havel Spandau"], ["Zander", "2024-12-20T23:27", 65, "Gummifisch", "Havel Spandau"], ["Zander", "2024-12-21T18:27", 80, "Gummifisch", "Havel Spandau"], ["Zander", "2024-12-25T11:43", 73, "Gummifisch", "Havel Spandau"], ["Zander", "2024-12-26T10:05", 80, "Gummifisch", "Havel Spandau"], ["Zander", "2025-03-01T16:02", 85, "Wurm", "Havel Spandau"], ["Zander", "2025-06-01T01:15", 82, "Gummifisch", "Havel Spandau"], ["Zander", "2025-06-03T15:46", 45, "Hegene", "Tegeler See"], ["Zander", "2025-06-07T01:20", 88, "Gummifisch", "Havel Spandau"], ["Zander", "2025-06-14T01:07", 82, "Gummifisch", "Havel Spandau"], ["Zander", "2025-10-11T17:39", 50, "Gummifisch", "Havel Spandau"], ["Zander", "2025-10-19T12:54", 62, "Gummifisch", "Havel Spandau"], ["Zander", "2025-10-20T22:45", 81, "Wobbler", "Havel Spandau"], ["Zander", "2025-11-01T17:22", 77, "Wobbler", "Tegeler See"], ["Zander", "2025-11-07T06:13", 81, "Gummifisch", "Havel Spandau"], ["Zander", "2025-11-12T22:37", 56, "Gummifisch", "Havel Spandau"], ["Zander", "2025-12-20T17:36", 45, "Gummifisch", "Tegeler See"], ["Zander", "2025-12-24T17:25", 45, "Gummifisch", "Tegeler See"], ["Zander", "2026-05-01T16:40", 80, "Gummifisch", "Havel Spandau"], ["Zander", "2026-05-16T22:10", 71, "Gummifisch", "Havel Spandau"], ["Zander", "2026-06-01T23:10", 81, "Wobbler", "Havel Spandau"], ["Zander", "2026-06-02T18:30", 78, "Jerkbait", "Havel Spandau"], ["Zander", "2026-06-19T09:35", 87, "Gummifisch", "Tegeler See"], ["Zander", "2026-09-10T18:00", 55, "Gummifisch", "Bleilochtalsperre"], ["Zander", "2026-09-18T20:37", 70, "Gummifisch", "Stößensee"], ["Zander", "2026-10-03T23:34", 76, "Gummifisch", "Stößensee"], ["Zander", "2026-10-10T18:36", 72, "Wobbler", "Rhein (Rees)"], ["Zander", "2026-10-12T12:58", 57, "Wobbler", "Main (Hochheim am Main)"], ["Zander", "2026-10-12T17:14", 51, "Crankbait", "Küstenkanal (Friesoythe-Saterland)"], ["Zander", "2026-10-12T18:12", 57, "Gummifisch", "Elbe (Hitzacker/Elbe)"], ["Zander", "2026-10-12T18:28", 75, "Twister", "Rhein (Duisburg-Beek)"], ["Zander", "2026-10-12T20:00", 80, "Fischlaich", "Kraaijenbergse Plassen"], ["Zander", "2026-10-12T20:09", 57, "Wobbler", "Nord-Ostsee-Kanal (Sehestedt)"], ["Zander", "2026-10-12T20:18", 63, "Wobbler", "Rhein (Rees)"], ["Zander", "2026-10-12T20:50", 62, "Gummifisch", "Weser (Bremen-Hemelingen)"], ["Zander", "2026-10-13T06:37", 52, "Wobbler", "Nord-Ostsee-Kanal (Schülp)"], ["Zander", "2026-10-13T06:40", 57, "Gummifisch", "Maas (Venlo)"], ["Zander", "2026-10-13T12:07", 56, "Gummifisch", "Süderelbe (Hamburg-Kohlbrand)"], ["Zander", "2026-10-13T14:52", 60, "Gummifisch", "Eider (Dellstedt-Wrohm)"], ["Zander", "2026-10-13T16:24", 58, "Gummifisch", "Eider (Dellstedt-Wrohm)"], ["Zander", "2026-10-13T16:45", 64, "Gummifisch", "Saaler Bodden"], ["Zander", "2026-10-13T18:11", 48, "Gummifisch", "Rhein (Rheinberg)"], ["Zander", "2026-10-13T18:36", 63, "Gummifisch", "Datteln-Hamm-Kanal (Hamm)"], ["Zander", "2026-10-13T18:37", 45, "Wobbler", "Rhein (Rheinberg)"], ["Zander", "2026-10-13T18:47", 54, "Wobbler", "Rhein (Rheinberg)"], ["Zander", "2026-10-13T18:56", 46, "Wobbler", "Rhein (Rheinberg)"], ["Zander", "2026-10-13T19:21", 66, "Wobbler", "Elbe (Tangermünde)"], ["Zander", "2026-10-13T19:35", 95, "Gummifisch", "Elbe (Hitzacker/Elbe)"]];const COORD={"Tegeler See": [52.585, 13.26], "Stößensee": [52.51, 13.215], "Kraaijenbergse Plassen": [51.77, 5.82], "Bleilochtalsperre": [50.52, 11.7], "Saaler Bodden": [54.33, 12.5], "Rhein (Rheinberg)": [51.55, 6.6], "Elbe (Hitzacker/Elbe)": [53.15, 11.04], "Eider (Dellstedt-Wrohm)": [54.27, 9.21], "Elbe (Tangermünde)": [52.54, 11.97], "Datteln-Hamm-Kanal (Hamm)": [51.68, 7.82], "Rhein (Rees)": [51.76, 6.4], "Süderelbe (Hamburg-Kohlbrand)": [53.53, 9.94], "Nord-Ostsee-Kanal (Schülp)": [54.28, 9.63], "Maas (Venlo)": [51.37, 6.17], "Weser (Bremen-Hemelingen)": [53.06, 8.88], "Nord-Ostsee-Kanal (Sehestedt)": [54.36, 9.82], "Küstenkanal (Friesoythe-Saterland)": [53.02, 7.86], "Main (Hochheim am Main)": [50.01, 8.35], "Rhein (Duisburg-Beek)": [51.5, 6.73], "Havel Spandau": [52.53, 13.2]};const TYP={"Tegeler See": "See", "Stößensee": "See", "Kraaijenbergse Plassen": "See", "Bleilochtalsperre": "See", "Saaler Bodden": "Bodden", "Rhein (Rheinberg)": "Fluss", "Elbe (Hitzacker/Elbe)": "Fluss", "Eider (Dellstedt-Wrohm)": "Fluss", "Elbe (Tangermünde)": "Fluss", "Datteln-Hamm-Kanal (Hamm)": "Kanal", "Rhein (Rees)": "Fluss", "Süderelbe (Hamburg-Kohlbrand)": "Fluss", "Nord-Ostsee-Kanal (Schülp)": "Kanal", "Maas (Venlo)": "Fluss", "Weser (Bremen-Hemelingen)": "Fluss", "Nord-Ostsee-Kanal (Sehestedt)": "Kanal", "Küstenkanal (Friesoythe-Saterland)": "Kanal", "Main (Hochheim am Main)": "Fluss", "Rhein (Duisburg-Beek)": "Fluss", "Havel Spandau": "Fluss"};
const fmt=v=>v==null?'–':String(Math.round(v*10)/10).replace('.',',');
const trendTxt=d=>d==null?'–':d>=2?'stark steigend':d>=0.7?'leicht steigend':d>-0.7?'stabil':d>-2?'leicht fallend':'stark fallend';
const dstr=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const hkey=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:00`;};
let rows=[];
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error('Fehler '+r.status);return r.json();}
document.getElementById('go').onclick=async()=>{
  const st=document.getElementById('status');st.textContent='Lade …';
  const vars='temperature_2m,pressure_msl,cloud_cover,wind_speed_10m,wind_gusts_10m,precipitation';
  const idx={};const groups={};
  for(const [sp,iso,len,bait,gew] of F){const t=new Date(iso).getTime();const k=gew+'|'+(Date.now()-t<6*864e5?'recent':dstr(t));(groups[k]=groups[k]||[]).push(t);}
  const keys=Object.keys(groups);let done=0,fail=0;
  for(let i=0;i<keys.length;i+=6){await Promise.all(keys.slice(i,i+6).map(async k=>{
    const [gew,day]=k.split('|');const [la,lo]=COORD[gew];const base=`latitude=${la}&longitude=${lo}&hourly=${vars}&timezone=Europe%2FBerlin&wind_speed_unit=kmh`;
    try{let d;
      if(day==='recent')d=await get(`https://api.open-meteo.com/v1/forecast?${base}&past_days=10&forecast_days=1`);
      else{const t=new Date(day+'T12:00').getTime();d=await get(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${dstr(t-864e5)}&end_date=${dstr(t+864e5)}`);}
      const m=idx[gew]=idx[gew]||new Map();d.hourly.time.forEach((tt,j)=>{if(d.hourly.pressure_msl[j]!=null&&!m.has(tt))m.set(tt,{d,i:j});});
    }catch(e){fail++;}
    done++;st.textContent=`Lade … ${done}/${keys.length}`;}));}
  rows=F.map(([sp,iso,len,bait,gew])=>{const t=new Date(iso).getTime(),M=idx[gew]||new Map(),e=M.get(hkey(t)),e3=M.get(hkey(t-3*36e5)),g=k=>e?e.d.hourly[k][e.i]:null;
    return {sp,iso,len,bait,gew,typ:TYP[gew]||'',tmp:g('temperature_2m'),p:g('pressure_msl'),dp:e&&e3?e.d.hourly.pressure_msl[e.i]-e3.d.hourly.pressure_msl[e3.i]:null,cc:g('cloud_cover'),ws:g('wind_speed_10m'),wg:g('wind_gusts_10m'),pr:g('precipitation')};});
  document.getElementById('t').innerHTML='<tr><th>Gewässer</th><th>Typ</th><th>Fangzeit</th><th>cm</th><th>Luft °C</th><th>hPa</th><th>Tendenz 3h</th><th>Wolken %</th><th>Wind</th><th>Böen</th><th>Regen</th></tr>'+
    rows.map(r=>`<tr><td>${r.gew}</td><td>${r.typ}</td><td>${r.iso.replace('T',' ')}</td><td>${r.len??''}</td><td>${fmt(r.tmp)}</td><td>${fmt(r.p)}</td><td>${r.dp==null?'–':(r.dp>0?'+':'')+fmt(r.dp)+' ('+trendTxt(r.dp)+')'}</td><td>${fmt(r.cc)}</td><td>${fmt(r.ws)}</td><td>${fmt(r.wg)}</td><td>${fmt(r.pr)}</td></tr>`).join('');
  const sum=document.getElementById('sum');sum.hidden=false;
  sum.innerHTML=['See','Fluss','Kanal'].map(ty=>{const R=rows.filter(r=>r.typ===ty&&r.p!=null);if(!R.length)return '';const c={};R.forEach(r=>{const k=trendTxt(r.dp);c[k]=(c[k]||0)+1;});const av=k=>fmt(R.reduce((a,r)=>a+r[k],0)/R.length);
    return `<b>Zander ${ty}</b> (${R.length}): Ø ${av('p')} hPa, Ø ${av('cc')} % Wolken, Ø ${av('ws')} km/h Wind. Tendenz: ${Object.entries(c).map(([k,v])=>k+' '+v).join(', ')}.`;}).join('<br>');
  document.getElementById('csv').hidden=false;st.textContent=`Fertig: ${rows.filter(r=>r.p!=null).length} von ${rows.length} Fängen mit Wetter.`+(fail?` (${fail} Abrufe fehlgeschlagen, ggf. erneut tippen)`:'');
};
document.getElementById('csv').onclick=()=>{const c=v=>v==null?'':String(Math.round(v*10)/10).replace('.',',');
  const txt='\ufeffGewässer;Typ;Fangzeit;Länge cm;Köder;Luft °C;Luftdruck hPa;Tendenz 3h hPa;Tendenz;Wolken %;Wind km/h;Böen km/h;Regen mm\n'+rows.map(r=>[r.gew,r.typ,r.iso.replace('T',' '),r.len??'',r.bait,c(r.tmp),c(r.p),c(r.dp),trendTxt(r.dp),c(r.cc),c(r.ws),c(r.wg),c(r.pr)].join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='zander-wetter.csv';document.body.appendChild(a);a.click();a.remove();};
</script></body></html>
