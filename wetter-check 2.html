const fmt=v=>v==null?'–':String(Math.round(v*10)/10).replace('.',',');
const trendTxt=d=>d==null?'–':d>=2?'stark steigend':d>=0.7?'leicht steigend':d>-0.7?'stabil':d>-2?'leicht fallend':'stark fallend';
let rows=[];
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error('Fehler '+r.status);return r.json();}
document.getElementById('go').onclick=async()=>{
  const st=document.getElementById('status');st.textContent='Lade …';
  try{
    const vars='temperature_2m,pressure_msl,cloud_cover,wind_speed_10m,wind_gusts_10m,precipitation,relative_humidity_2m';
    const idx={};
    for(const [gew,[LAT,LNG]] of Object.entries(COORD)){
      const base=`latitude=${LAT}&longitude=${LNG}&hourly=${vars}&timezone=Europe%2FBerlin&wind_speed_unit=kmh`;
      st.textContent='Lade '+gew+' …';
      const [a,f]=await Promise.all([
        get(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=2023-10-25&end_date=2026-06-05`),
        get(`https://api.open-meteo.com/v1/forecast?${base}&past_days=92&forecast_days=1`).catch(()=>null)]);

      return {sp,iso,len,bait,gew,tmp:g('temperature_2m'),p:g('pressure_msl'),dp,cc:g('cloud_cover'),ws:g('wind_speed_10m'),wg:g('wind_gusts_10m'),pr:g('precipitation'),rh:g('relative_humidity_2m')};

      const c={};R.forEach(r=>{const k=trendTxt(r.dp);c[k]=(c[k]||0)+1;});const av=k=>fmt(R.reduce((a,r)=>a+r[k],0)/R.length);
      return `<b>${s}, ${g}</b> (${R.length}): Ø ${av('tmp')} °C Luft, Ø ${av('p')} hPa, Ø ${av('cc')} % Wolken, Ø ${av('ws')} km/h Wind. Drucktendenz: ${Object.entries(c).map(([k,v])=>k+' '+v).join(', ')}.`;}).join('<br>');
    document.getElementById('csv').hidden=false;st.textContent=`Fertig: ${rows.filter(r=>r.p!=null).length} von ${rows.length} Fängen mit Wetter.`;
  }catch(e){st.textContent='Abruf fehlgeschlagen: '+e.message+'. Internetverbindung prüfen. Auf dem iPhone die Datei über GitHub öffnen, nicht aus der Dateien-App.';}
};
document.getElementById('csv').onclick=()=>{
  const c=v=>v==null?'':String(Math.round(v*10)/10).replace('.',',');
  const txt='\ufeffArt;Gewässer;Fangzeit;Länge cm;Köder;Luft °C;Luftdruck hPa;Tendenz 3h hPa;Tendenz;Wolken %;Wind km/h;Böen km/h;Regen mm;Feuchte %\n'+
    rows.map(r=>[r.sp,r.gew,r.iso.replace('T',' '),r.len,r.bait,c(r.tmp),c(r.p),c(r.dp),trendTxt(r.dp),c(r.cc),c(r.ws),c(r.wg),c(r.pr),c(r.rh)].join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='faenge-havel-tegel-wetter.csv';document.body.appendChild(a);a.click();a.remove();
};
